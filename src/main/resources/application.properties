spring.application.name=gps-ci-cd

# Puerto en el que escucha el servidor embebido (Tomcat).
# 8080 es el valor por defecto de Spring Boot; lo dejamos explicito
# porque en Azure App Service configuraremos WEBSITES_PORT=8080
# para que la plataforma enrute las peticiones a este puerto.
server.port=8080

# JPA: crea/actualiza el esquema segun las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
 
# Sin datasource configurado, en LOCAL y en la CI se usa H2 en memoria
# (automatico). En Azure, la conexion a Azure SQL se pasa por variables
# de entorno (App Settings), sin escribir credenciales en el repositorio:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
